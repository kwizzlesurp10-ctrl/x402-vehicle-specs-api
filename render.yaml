services:
  - type: web
    name: x402-vehicle-specs-api
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/vehicles.db
      - key: PAY_TO_ADDRESS
        sync: false
      - key: X402_NETWORK
        value: base-sepolia
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
    disk:
      name: vehicle-data
      mountPath: /var/data
      sizeGB: 1
