name: Weekly EPA ingest

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - run: npm run ingest
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
